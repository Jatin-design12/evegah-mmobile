workflows:
  ionic-ios-workflow:
    name: Ionic iOS Build

    environment:
      node: 18
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install -g @ionic/cli
          npm install -g @angular/cli

      - name: Build Ionic app
        script: |
          ionic build

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - chavdahimanshu2010@gmail.com
