scripts:
  - name: Install dependencies
    script: |
      npm install
      npm install -g @ionic/cli
      npm install -g @angular/cli

  - name: Build Ionic app
    script: |
      ionic build

  - name: Sync Capacitor
    script: |
      npx cap sync ios

  - name: Install CocoaPods
    script: |
      cd ios/App
      pod install
